name: Build & Push Docker Image

# 用途：把当前源码构建成多架构镜像并推送到 Docker Hub (tannic666/dufs)
# 触发方式：① 网页手动 Run workflow（可选自定义 tag）② push v* 标签
# 依赖 secret：DOCKERHUB_TOKEN（Docker Hub → Account Settings → Personal access tokens）

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像版本 tag（留空则用 latest）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  docker:
    name: Build multi-arch image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: tannic666
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            tannic666/dufs:latest
            tannic666/dufs:${{ github.event.inputs.tag || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DUFS_BUILD_ID=${{ github.run_number }}
