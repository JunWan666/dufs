<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <noscript>
    <meta http-equiv="refresh" content="0; url=?noscript">
  </noscript>
  <title>Dufs</title>
  <link rel="icon" type="image/x-icon" href="__ASSETS_PREFIX__favicon.ico">
  <link rel="stylesheet" href="__ASSETS_PREFIX__index.css">
</head>

<body>
  <div class="app-shell">
    <header class="head">
      <div class="brand-block">
        <a class="brand-mark" href="/" aria-label="Dufs">
          <span class="brand-logo">D</span>
          <span class="brand-text">Dufs</span>
        </a>
        <div class="breadcrumb" aria-label="当前位置"></div>
      </div>

      <form class="searchbar hidden">
        <div class="icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16">
            <path
              d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" />
          </svg>
        </div>
        <input id="search" title="搜索文件或文件夹" placeholder="搜索文件或文件夹" name="q" type="text" maxlength="128"
          autocomplete="off" tabindex="1">
        <input type="submit" hidden />
      </form>

      <div class="toolbar-cluster">
        <div class="toolbox">
          <a href="" class="control download hidden" title="打包下载" download="">
            <svg width="16" height="16" viewBox="0 0 16 16">
              <path
                d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z" />
              <path
                d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z" />
            </svg>
            <span>打包下载</span>
          </a>
          <div class="control move-file hidden" title="移动或重命名">
            <svg class="icon-move" width="16" height="16" viewBox="0 0 16 16">
              <path fill-rule="evenodd"
                d="M1.5 1.5A.5.5 0 0 0 1 2v4.8a2.5 2.5 0 0 0 2.5 2.5h9.793l-3.347 3.346a.5.5 0 0 0 .708.708l4.2-4.2a.5.5 0 0 0 0-.708l-4-4a.5.5 0 0 0-.708.708L13.293 8.3H3.5A1.5 1.5 0 0 1 2 6.8V2a.5.5 0 0 0-.5-.5z">
              </path>
            </svg>
            <span>移动</span>
          </div>
          <div class="control delete-file danger hidden" title="删除">
            <svg class="icon-delete" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path
                d="M6.854 7.146a.5.5 0 1 0-.708.708L7.293 9l-1.147 1.146a.5.5 0 0 0 .708.708L8 9.707l1.146 1.147a.5.5 0 0 0 .708-.708L8.707 9l1.147-1.146a.5.5 0 0 0-.708-.708L8 8.293 6.854 7.146z" />
              <path
                d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2zM9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5v2z" />
            </svg>
            <span>删除</span>
          </div>
          <div class="control upload-file primary hidden" title="上传文件或文件夹">
            <label for="file">
              <svg width="16" height="16" viewBox="0 0 16 16">
                <path
                  d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z" />
                <path
                  d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z" />
              </svg>
              <span>上传</span>
            </label>
            <input type="file" id="file" title="上传文件或文件夹" name="file" multiple>
          </div>
          <div class="control new-folder hidden" title="新建文件夹">
            <svg width="16" height="16" viewBox="0 0 16 16">
              <path
                d="m.5 3 .04.87a1.99 1.99 0 0 0-.342 1.311l.637 7A2 2 0 0 0 2.826 14H9v-1H2.826a1 1 0 0 1-.995-.91l-.637-7A1 1 0 0 1 2.19 4h11.62a1 1 0 0 1 .996 1.09L14.54 8h1.005l.256-2.819A2 2 0 0 0 13.81 3H9.828a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 6.172 1H2.5a2 2 0 0 0-2 2zm5.672-1a1 1 0 0 1 .707.293L7.586 3H2.19c-.24 0-.47.042-.683.12L1.5 2.98a1 1 0 0 1 1-.98h3.672z" />
              <path
                d="M13.5 10a.5.5 0 0 1 .5.5V12h1.5a.5.5 0 1 1 0 1H14v1.5a.5.5 0 1 1-1 0V13h-1.5a.5.5 0 0 1 0-1H13v-1.5a.5.5 0 0 1 .5-.5z" />
            </svg>
            <span>新建文件夹</span>
          </div>
          <div class="control new-file hidden" title="新建文件">
            <svg width="16" height="16" viewBox="0 0 16 16">
              <path
                d="M8 6.5a.5.5 0 0 1 .5.5v1.5H10a.5.5 0 0 1 0 1H8.5V11a.5.5 0 0 1-1 0V9.5H6a.5.5 0 0 1 0-1h1.5V7a.5.5 0 0 1 .5-.5z" />
              <path
                d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5L14 4.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5h-2z" />
            </svg>
            <span>新建文件</span>
          </div>
        </div>

        <div class="toolbox-right">
          <div class="permission-pill">只读模式</div>
          <select class="language-select" title="语言">
            <option value="zh-CN">中文</option>
            <option value="en-US">English</option>
          </select>
          <div class="login-btn hidden" title="登录">
            <svg width="16" height="16" viewBox="0 0 16 16">
              <path fill-rule="evenodd"
                d="M6 3.5a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-2a.5.5 0 0 0-1 0v2A1.5 1.5 0 0 0 6.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-8A1.5 1.5 0 0 0 5 3.5v2a.5.5 0 0 0 1 0v-2z" />
              <path fill-rule="evenodd"
                d="M11.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5H1.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z" />
            </svg>
            <span>登录</span>
          </div>
          <div class="logout-btn hidden" title="退出登录">
            <span class="user-avatar"></span>
            <span class="user-name"></span>
          </div>
          <div class="save-btn hidden" title="保存文件">
            <svg viewBox="0 0 16 16" width="16" height="16">
              <path
                d="M13.5 1h-11A1.5 1.5 0 0 0 1 2.5v11A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5V4.7L11.3 1H10v4H4V1h6V0H2.5A2.5 2.5 0 0 0 0 2.5v11A2.5 2.5 0 0 0 2.5 16h11a2.5 2.5 0 0 0 2.5-2.5V4.3L11.7 0H10v1h1.3L15 4.7v8.8a1.5 1.5 0 0 1-1.5 1.5z" />
            </svg>
            <span>保存</span>
          </div>
        </div>
      </div>
    </header>

    <div class="admin-banner hidden" id="admin-banner">
      <div class="admin-banner-text">
        <strong>还没有设置访问密码</strong>
        <span>当前任何人都能浏览、上传和删除这个目录的文件，建议先设置一个管理员账号。</span>
      </div>
      <button class="btn btn-primary admin-banner-action" type="button">设置密码</button>
    </div>

    <main class="main">
      <div class="index-page hidden">
        <section class="status-strip">
          <div>
            <div class="status-title">文件列表</div>
            <div class="status-subtitle">拖拽文件到页面任意位置即可上传</div>
          </div>
          <div class="status-meta">
            <span class="locale-note">默认语言：中文（zh-CN）</span>
          </div>
        </section>

        <nav class="pathbar hidden" aria-label="路径导航">
          <div class="pathbar-actions">
            <button class="pathbar-btn history-back" type="button" title="后退"></button>
            <button class="pathbar-btn history-forward" type="button" title="前进"></button>
            <button class="pathbar-btn parent-dir" type="button" title="上一级"></button>
            <button class="pathbar-btn refresh-dir" type="button" title="刷新"></button>
          </div>
          <div class="pathbar-label">当前路径</div>
          <div class="pathbar-crumbs"></div>
        </nav>

        <div class="empty-folder hidden"></div>
        <table class="uploaders-table hidden">
          <thead>
            <tr>
              <th class="cell-name" colspan="2">名称</th>
              <th class="cell-status">进度</th>
            </tr>
          </thead>
        </table>
        <div class="table-frame">
          <table class="paths-table hidden">
            <thead>
            </thead>
            <tbody>
            </tbody>
          </table>
        </div>
      </div>
      <div class="editor-page hidden">
        <div class="not-editable hidden"></div>
        <textarea id="editor" class="editor hidden" aria-label="编辑器" cols="10"></textarea>
      </div>
    </main>
  </div>

  <div class="drop-overlay hidden" id="drop-overlay" aria-hidden="true">
    <div class="drop-overlay-frame">
      <div class="drop-overlay-badge">
        <svg width="18" height="18" viewBox="0 0 16 16">
          <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z" />
          <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z" />
        </svg>
      </div>
      <div class="drop-overlay-title" id="drop-overlay-title">松开鼠标即可上传</div>
      <div class="drop-overlay-desc" id="drop-overlay-desc">文件将保存到当前目录</div>
      <div class="drop-overlay-path">
        <svg width="13" height="13" viewBox="0 0 14 16"><path fill-rule="evenodd" d="M13 4H7V3c0-.66-.31-1-1-1H1c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1V5c0-.55-.45-1-1-1zM6 4H1V3h5v1z"></path></svg>
        <b id="drop-overlay-path">/</b>
      </div>
      <div class="drop-overlay-hint" id="drop-overlay-hint">支持文件与整个文件夹</div>
    </div>
  </div>

  <div class="dialog-layer hidden" id="dialog-layer" aria-hidden="true"></div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

  <template id="index-data">__INDEX_DATA__</template>
  <script src="__ASSETS_PREFIX__index.js"></script>
</body>

</html>
